version: "3.8"

services:
  db:
    image: 'postgres:18'
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - 'app-db-data:/var/lib/postgresql/data/pgdata'
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_DB=${POSTGRES_DB}'

  adminer:
    image: adminer
    restart: always
    depends_on:
      - db
    labels:
      - 'coolify.fqdn=https://adminer.nodepad.lex1001.cc'

  prestart:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    command: 'bash scripts/prestart.sh'
    environment:
      - 'DOMAIN=${DOMAIN}'
      - ENVIRONMENT=production
      - 'SECRET_KEY=${SECRET_KEY}'
      - 'FIRST_SUPERUSER=${FIRST_SUPERUSER}'
      - 'FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}'
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    environment:
      - 'DOMAIN=${DOMAIN}'
      - ENVIRONMENT=production
      - 'BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}'
      - 'SECRET_KEY=${SECRET_KEY}'
      - 'FIRST_SUPERUSER=${FIRST_SUPERUSER}'
      - 'FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}'
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:8000/api/v1/utils/health-check/'
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - 'coolify.fqdn=https://api.nodepad.lex1001.cc'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - 'VITE_API_URL=https://api.nodepad.lex1001.cc'
        - NODE_ENV=production
    restart: always
    labels:
      - 'coolify.fqdn=https://nodepad.lex1001.cc'

volumes:
  app-db-data: null